name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências nas versões travadas
        run: npm ci

      - name: Conferir os tipos e gerar o site
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: publicacao
        uses: actions/deploy-pages@v5
